[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coverage-aware-controller-agent"
version = "0.1.0"
description = "Simple ReAct plus Coverage-Aware Controller integration for AppWorld."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["controller_agent/tests", "controller_agent/branching/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["controller_agent*"]
